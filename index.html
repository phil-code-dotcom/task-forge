<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>TaskForge</title>

    <!-- Tailwind via CDN. darkMode: 'class' means dark styles apply when <html> has the class "dark" -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

    <header class="border-b border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 p-4">
            <h1 class="text-2xl font-bold text-green-700 dark:text-green-400">TaskForge</h1>

            <nav class="flex flex-wrap items-center gap-2">
                <button id="export-btn" type="button" class="rounded border px-3 py-1 text-sm">Export</button>
                <button id="import-btn" type="button" class="rounded border px-3 py-1 text-sm">Import</button>
                <!-- Hidden file input: the Import button will click this one from JS -->
                <input id="import-input" type="file" accept=".json" class="hidden">
                <button id="theme-toggle" type="button" class="rounded border px-3 py-1 text-sm">Dark mode</button>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-5xl space-y-4 p-4">

        <!-- the statistics card section-->
        <section id="stats" class="grid grid-cols-2 gap-3 md:grid-cols-4">
            <div class="rounded-lg bg-white p-4 shadow dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Total tasks</p>
                <p id="stat-total" class="text-3xl font-bold">0</p>
            </div>
            <div class="rounded-lg bg-white p-4 shadow dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Completed</p>
                <p id="stat-completed" class="text-3xl font-bold">0</p>
            </div>
            <div class="rounded-lg bg-white p-4 shadow dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Pending</p>
                <p id="stat-pending" class="text-3xl font-bold">0</p>
            </div>
            <div class="rounded-lg bg-white p-4 shadow dark:bg-slate-800">
                <p class="text-sm text-slate-500 dark:text-slate-400">Overdue</p>
                <p id="stat-overdue" class="text-3xl font-bold">0</p>
            </div>
        </section>

        <!--tool bar section - search, add and the rest-->
        <section id="toolbar" class="space-y-3 rounded-lg bg-white p-4 shadow dark:bg-slate-800">
            <div class="flex flex-wrap gap-3">
                <input id="search-input" type="search" placeholder="Search title, description or category  ( press / )"
                    class="min-w-0 flex-1 rounded border px-3 py-2 dark:bg-slate-700">
                <button id="add-task-btn" type="button"
                    class="rounded bg-green-700 px-4 py-2 font-semibold text-white hover:bg-green-800">
                    + Add Task (N)
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
                <div>
                    <label for="filter-status" class="text-sm">Status</label>
                    <select id="filter-status" class="w-full rounded border px-2 py-2 dark:bg-slate-700">
                        <option value="all">All</option>
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                        <option value="overdue">Overdue</option>
                    </select>
                </div>
                <div>
                    <label for="filter-priority" class="text-sm">Priority</label>
                    <select id="filter-priority" class="w-full rounded border px-2 py-2 dark:bg-slate-700">
                        <option value="all">All</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div>
                    <label for="filter-category" class="text-sm">Category</label>
                    <select id="filter-category" class="w-full rounded border px-2 py-2 dark:bg-slate-700">
                        <option value="all">All</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="school">School</option>
                        <option value="backend">Backend</option>
                        <option value="frontend">Frontend</option>
                        <option value="fintech">Fintech</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="sort-select" class="text-sm">Sort by</label>
                    <select id="sort-select" class="w-full rounded border px-2 py-2 dark:bg-slate-700">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="az">A → Z</option>
                        <option value="za">Z → A</option>
                        <option value="priority-high">Highest priority</option>
                        <option value="priority-low">Lowest priority</option>
                        <option value="due-soon">Closest due date</option>
                        <option value="due-late">Furthest due date</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- bulk actions section-->
        <section id="bulk-bar" class="flex flex-wrap items-center gap-3 rounded-lg bg-white p-3 shadow dark:bg-slate-800">
            <label class="flex items-center gap-2">
                <input id="select-all" type="checkbox">
                Select all
            </label>
            <span id="selected-count" class="text-sm text-slate-500 dark:text-slate-400">0 selected</span>

            <div class="ml-auto flex flex-wrap gap-2">
                <button id="bulk-complete" type="button" class="rounded border px-3 py-1 text-sm">Mark completed</button>
                <button id="bulk-pending" type="button" class="rounded border px-3 py-1 text-sm">Mark pending</button>
                <button id="bulk-delete" type="button" class="rounded border border-red-500 px-3 py-1 text-sm text-red-600">Delete selected</button>
            </div>
        </section>

        <!-- task list + empty states + pagination-->
        <section>
            <!-- JS fills this list with task cards -->
            <ul id="task-list" class="space-y-3"></ul>

            <!-- Shown when there are no tasks at all -->
            <!-- <div id="empty-state" class="hidden rounded-lg bg-white p-8 text-center shadow dark:bg-slate-800">
                <p class="text-lg font-semibold">No tasks yet</p>
                <p class="text-slate-500 dark:text-slate-400">Press N or click Add Task to create your first one.</p>
            </div> -->

            <!-- Shown when search/filters match nothing -->
            <div id="no-results" class="hidden rounded-lg bg-white p-8 text-center shadow dark:bg-slate-800">
                <p class="text-lg font-semibold">No tasks found</p>
                <p class="text-slate-500 dark:text-slate-400">Try a different search or clear your filters.</p>
            </div>

            <!--pagination buttons will be generated here -->
            <div id="pagination" class="mt-4 flex flex-wrap justify-center gap-2"></div>
        </section>



    </main>

</body>

</html>
